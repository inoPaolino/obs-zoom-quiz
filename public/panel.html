<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pannello di Controllo</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{background:#111;color:#ddd;padding:12px;font-family:Arial}
    .controls{display:flex;gap:12px;align-items:flex-start}
    .panel-col{background:#121212;padding:12px;border-radius:6px;border:1px solid #222}
    .players-list{display:flex;flex-direction:column;gap:8px}
    button{padding:6px 10px;border-radius:4px;border:none;background:#1e88e5;color:#fff;cursor:pointer}
    input[type="text"]{padding:6px;border-radius:4px;border:1px solid #444;background:#0b0b0b;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(6,48px);grid-auto-rows:48px;gap:6px}
    .cell{background:#222;border:1px solid #333;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .cell.easy{background:#184d14}
    .cell.medium{background:#5a3e00}
    .cell.hard{background:#541b2d}
    .score-controls{display:flex;gap:6px;margin-top:6px}
  </style>
</head>
<body>
  <h2>Pannello di Controllo</h2>
  <div class="controls">
    <div class="panel-col" style="width:360px;">
      <label>Numero giocatori:
        <select id="numPlayers">
          <option>1</option><option>2</option><option>3</option><option selected>4</option>
        </select>
      </label>
      <div class="players-list" id="players"></div>
      <div style="margin-top:8px">
        <button id="applyPlayers">Applica</button>
      </div>
    </div>

    <div class="panel-col" style="flex:1;">
      <h4>Griglia 6x3 (A-F,1-3)</h4>
      <div class="grid" id="gridPanel"></div>
      <div style="margin-top:8px">
        <button id="closeFull">Chiudi immagine</button>
        <button id="revealNext">Rivela passo successivo</button>
      </div>
      <div style="margin-top:8px">
        <label>Seleziona giocatore per premiare:
          <select id="awardPlayer"></select>
        </label>
        <button id="awardPoints">Assegna punti</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/panel.js"></script>
</body>
</html>
